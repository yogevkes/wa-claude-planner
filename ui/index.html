<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f5f7f5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b1113" media="(prefers-color-scheme: dark)">
  <title>WA-Claude Planner</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page-glow" aria-hidden="true"></div>
  <header class="appbar">
    <div class="appbar-inner">
      <div class="brand">
        <span class="brand-mark"><img src="icon.svg" alt="" width="40" height="40"></span>
        <span class="brand-text">
          <span class="brand-name">WA-Claude <span class="brand-name-soft">Planner</span></span>
          <span class="brand-sub">העוזר האישי שלך ב-WhatsApp</span>
        </span>
      </div>
      <div class="pills" id="pills" aria-label="מצב החיבורים"></div>
      <button class="btn secondary btn-pause" id="pauseBtn" hidden></button>
    </div>
  </header>
  <main id="app" class="app-main" aria-live="polite">
    <div class="loading">
      <span class="loading-mark"><img src="icon.svg" alt="" width="44" height="44"></span>
      <span class="spinner" aria-hidden="true"></span>
      <span>טוען את העוזר שלך…</span>
    </div>
  </main>
  <div class="toasts" id="toasts" role="region" aria-label="הודעות מערכת"></div>
  <script src="app.js" type="module"></script>
</body>
</html>
