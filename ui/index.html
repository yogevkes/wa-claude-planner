<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>WA-Claude Planner</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="skip-link" href="#app">דילוג לתוכן</a>
  <header class="top">
    <div class="top-inner">
      <div class="brand">
        <img class="brand-logo" src="icon.svg" alt="" width="34" height="34">
        <div class="brand-text">
          <span class="brand-name">WA-Claude Planner</span>
          <span class="brand-sub">העוזר האישי שלך ב-WhatsApp</span>
        </div>
      </div>
      <div class="pills" id="pills" role="status" aria-label="מצב החיבורים"></div>
      <button class="btn secondary btn-sm" id="pauseBtn" type="button" hidden></button>
    </div>
  </header>
  <main id="app" aria-live="polite">
    <div class="loading">טוען…</div>
  </main>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <script src="app.js" type="module"></script>
</body>
</html>
